<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CL Testu katalogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: fixed left navigation + scrolling work area; test card opens as a right-side drawer.
   Codes of tests are set in mono, state is encoded as colored stripes and chips. */
:root {
  --bg: #eef2f3;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --ink: #14212b;
  --muted: #5a6a76;
  --line: #d6dee3;
  --accent: #0a6c78;
  --accent-ink: #ffffff;
  --accent-soft: #dff0f1;
  --good: #2e7a3a; --good-soft: #e3f2e5;
  --warn: #9a5b00; --warn-soft: #fbefd9;
  --bad: #b1261d; --bad-soft: #fbe3e0;
  --info: #3a5aa6; --info-soft: #e6ecf8;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --radius: 6px;
  --shadow: 0 8px 28px rgba(16, 33, 43, .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1619; --surface: #162126; --surface-2: #1b282e; --ink: #e4ecef; --muted: #93a6b0; --line: #2a3a42;
    --accent: #4fbfcb; --accent-ink: #062126; --accent-soft: #163a40;
    --good: #6cc47a; --good-soft: #1a3320; --warn: #e3a64a; --warn-soft: #3a2b12; --bad: #f08a80; --bad-soft: #3d1c19; --info: #8eaaf0; --info-soft: #1d2945;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1619; --surface: #162126; --surface-2: #1b282e; --ink: #e4ecef; --muted: #93a6b0; --line: #2a3a42;
  --accent: #4fbfcb; --accent-ink: #062126; --accent-soft: #163a40;
  --good: #6cc47a; --good-soft: #1a3320; --warn: #e3a64a; --warn-soft: #3a2b12; --bad: #f08a80; --bad-soft: #3d1c19; --info: #8eaaf0; --info-soft: #1d2945;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font-size: 20px; }
h3 { font-size: 15px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 228px 1fr; height: 100%; }
.nav { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 16px 10px; overflow-y: auto; }
.brand { padding: 4px 10px 16px; display: grid; gap: 2px; }
.brand b { font-size: 16px; letter-spacing: .01em; }
.brand span { font-size: 12px; color: var(--muted); }
.nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; color: var(--ink); }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge { font-size: 12px; font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 10px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.acc { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.nav .foot { margin-top: auto; padding: 12px 10px 0; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }

.main { overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.banner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--line); }
.banner.snap { background: var(--info-soft); }
.banner.local { background: var(--warn-soft); }
.banner p { margin: 0; max-width: 75ch; }
.view { padding: 20px 24px 48px; display: grid; gap: 16px; align-content: start; }
.view-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 80ch; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: grid; gap: 4px; }
.field label, .lbl { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="search"], input[type="number"], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
input[type="search"] { width: 260px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 2px; }
.tile b { font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
.tile span { font-size: 12px; color: var(--muted); }
.tile.good { border-left-color: var(--good); } .tile.warn { border-left-color: var(--warn); } .tile.bad { border-left-color: var(--bad); } .tile.acc { border-left-color: var(--accent); } .tile.info { border-left-color: var(--info); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; border: 1px solid transparent; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.plain { background: var(--surface-2); color: var(--muted); border-color: var(--line); }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
details.card > summary { cursor: pointer; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; list-style: none; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: "▸"; color: var(--muted, #888); }
details.card[open] > summary::before { content: "▾"; }
details.card > summary h3 { margin: 0; }
details.card[open] > summary { margin-bottom: 10px; }
table.cat thead tr.filters th { padding-top: 0; }
.th-sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; font-weight: 600; white-space: nowrap; }
.th-sort span { color: var(--muted); font-size: 11px; }
.th-sort.on span { color: var(--accent); }
.th-sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
tr.filters input, tr.filters select { width: 100%; min-width: 70px; font: inherit; font-size: 12px; font-weight: 400; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); box-sizing: border-box; }
td.clip { max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr.filters .active { border-color: var(--accent); background: var(--accent-soft); }
.colpick .colgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; max-height: 340px; overflow: auto; }
.colpick .colgrid label { font-size: 13px; padding: 2px 0; }
.modal.wide { width: min(720px, 100%); }
tr.jump td { background: var(--warn-soft, #fdf3e1); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.rolepick { margin-bottom: 8px; }
.rolepick select { width: 100%; }
.langs { display: flex; gap: 4px; margin-bottom: 8px; }
.langs button { font: inherit; font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
tr.group td { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; }
td.stripe { width: 4px; padding: 0; }
td.stripe.bad { background: var(--bad); } td.stripe.warn { background: var(--warn); } td.stripe.acc { background: var(--accent); } td.stripe.info { background: var(--info); }
td.name { min-width: 260px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 12px; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.empty { padding: 32px; text-align: center; color: var(--muted); }

.drawer-back { position: fixed; inset: 0; background: rgba(10, 20, 25, .35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.drawer header { background: var(--surface); padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.drawer .body { overflow-y: auto; padding: 16px 20px 24px; display: grid; gap: 14px; align-content: start; }
.drawer footer { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 16px; }
.kv > div { display: grid; gap: 2px; min-width: 0; }
.kv .v { overflow-wrap: anywhere; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 16px; }
.form .wide { grid-column: 1 / -1; }
.hint { font-size: 12px; color: var(--warn); }
.miss { border-color: var(--warn) !important; background: var(--warn-soft) !important; }
.dirty { border-color: var(--accent) !important; box-shadow: 0 0 0 1px var(--accent); }
.conflict { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 6px; }
.hist { display: grid; gap: 6px; font-size: 13px; }
.hist div { display: grid; grid-template-columns: 130px 1fr; gap: 8px; }
pre.json { margin: 0; max-height: 360px; overflow: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; font: 12px/1.45 var(--font-mono); white-space: pre; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 24px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.alert { border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 4px; }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--info-soft); color: var(--info); }
.alert ul { margin: 0; padding-left: 18px; }
.checklist { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: 4px 1fr auto auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 10px 0; }
.check .sev { align-self: stretch; border-radius: 0 3px 3px 0; }
.check .sev.bad { background: var(--bad); } .check .sev.warn { background: var(--warn); } .check .sev.info { background: var(--info); }
.check b { font-variant-numeric: tabular-nums; font-size: 18px; }
.modal-back { position: fixed; inset: 0; background: rgba(10, 20, 25, .45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 8px; padding: 18px 20px; width: min(520px, 100%); display: grid; gap: 12px; box-shadow: var(--shadow); }
.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; }
.toast { background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--radius); box-shadow: var(--shadow); max-width: 560px; }
.toast.bad { background: var(--bad); color: #fff; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .nav button { width: auto; white-space: nowrap; }
  .brand, .nav .foot { display: none; }
  .split { grid-template-columns: 1fr; }
  .view { padding: 16px; }
  input[type="search"] { width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Sadaļas" data-tr-aria="Разделы">
    <div class="brand"><b>Testu katalogs</b><span>Centrālā Laboratorija · <span data-tr="прототип">prototips</span></span></div>
    <button data-go="catalog"><span data-tr="Каталог">Katalogs</span><span class="badge" id="nb-catalog">—</span></button>
    <button data-go="export"><span data-tr="Отправка в SmartLIS">Nosūtīšana uz SmartLIS</span><span class="badge" id="nb-export">—</span></button>
    <button data-go="import"><span data-tr="Импорт из SmartLIS">Imports no SmartLIS</span><span></span></button>
    <button data-go="site"><span data-tr="Сайт (Web JSON)">Vietne (Web JSON)</span><span class="badge" id="nb-site">—</span></button>
    <button data-go="checks"><span data-tr="Проверки">Pārbaudes</span><span class="badge" id="nb-checks">—</span></button>
    <button data-go="log"><span data-tr="Журнал">Žurnāls</span><span></span></button>
    <button data-go="setup"><span data-tr="Настройки">Iestatījumi</span><span></span></button>
    <div class="foot" id="navfoot"></div>
  </nav>
  <main class="main" id="main">
    <div id="banner"></div>
    <section class="view" id="view"><div class="empty" data-tr="Загружаю каталог…">Ielādēju katalogu…</div></section>
  </main>
</div>
<div id="drawer"></div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="logic.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
/* ================= state ================= */
const DEFAULT_COLS = ["code", "name", "sectionid", "sampleid", "fin_price2", "publish", "catalog"];
const VIEW_KEY = "clcat.view.v1";
function loadViewPrefs() {
  try { const v = JSON.parse(localStorage.getItem(VIEW_KEY) || "null"); if (v && Array.isArray(v.cols) && v.cols.length) { S.cols = v.cols; if (v.sort) S.sort = v.sort; } } catch (e) { /* storage unavailable: defaults */ }
}
function saveViewPrefs() { try { localStorage.setItem(VIEW_KEY, JSON.stringify({ cols: S.cols, sort: S.sort })); } catch (e) { /* ignore */ } }
const S = {
  mode: "loading",            // loading | snapshot | live | local
  fields: DEFAULT_FIELDS.map(f => ({ ...f })),
  settings: { ...DEFAULT_SETTINGS },
  dicts: {},
  tests: new Map(),
  hist: {},
  events: [],
  snapshotInfo: null,
  perms: { write: true, admin: false, owner: false },
  me: null,
  view: "catalog",
  f: { q: "", status: "", check: "" },
  cols: DEFAULT_COLS.slice(),   // visible catalog columns (field keys), remembered per viewer
  sort: { k: null, dir: 1 },    // column sort: dir 1 = A→Z / small→large, -1 = reverse
  cf: {},                       // column filters: field key → filter text or choice value
  colpick: false,
  web: { versions: [], current: null, local: {} },   // published versions of the site JSON; current = what the API serves
  role: "viewer",
  group: false,
  page: 0,
  selected: new Set(),
  openCode: null,
  edits: {},
  importPlan: null, importFile: "", importOverride: false,
  exportOverride: false,
  excelPlan: null,
  dictTab: "sampleid",
  names: {},
  busy: null,
};
const PAGE = 100;
let db = null, user = null, downloads = null, seedCache = null;
const subs = { chunks: {}, hist: {} };

loadViewPrefs();
applyStaticText();
const F = () => S.fields;
const FM = () => fieldMap(S.fields);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel) => document.querySelector(sel);

function disp(k, v) {
  const f = FM()[k];
  if (isEmpty(v)) return "—";
  if (f && f.t === "dict") return dictName(S.dicts, k, v);
  if (f && f.t === "bool") return norm(v) === "TRUE" ? "Jā" : "Nē";
  if (f && f.t === "publish") return { TRUE: "Jā", FALSE: "Nē", AKC: "AKC" }[norm(v)] || String(v);
  if (f && f.price) return Number(norm(v)).toFixed(2);
  return String(v);
}
const fmtTime = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString("lv-LV", { dateStyle: "short", timeStyle: "short" }); };
/* Roles. Production: AD groups decide (admin = DPT CLA ITD Admins, business = DPT CLA Administracija,
   marketing = DPT CLA Marketinga nodala) and the server checks every save and send.
   Prototype: the Share level limits which roles a person may pick: Owner/Editor — any role, Contributor — business or
   marketing, Viewer/Commenter — viewing only. The pick is remembered in this browser and written into the log. */
const ROLE_KEY = "clcat.role.v1";
function allowedRoles() {
  if (S.perms.admin) return ["admin", "business", "marketing", "viewer"];
  if (S.perms.write) return ["business", "marketing", "viewer"];
  return ["viewer"];
}
function pickRole(r) {
  const a = allowedRoles();
  if (r === undefined) { try { r = localStorage.getItem(ROLE_KEY); } catch (e) { r = null; } }
  S.role = a.includes(r) ? r : a[0];
  try { localStorage.setItem(ROLE_KEY, S.role); } catch (e) { /* ignore */ }
}
const myRoles = () => [S.role];
const isAdminRole = () => S.role === "admin" && S.perms.admin;
const canWrite = () => (S.mode === "live" || S.mode === "local") && S.perms.write && S.role !== "viewer";
// May the current viewer edit this field? Prototype: client-side check; the production app enforces it on the server.
function canEditField(f) { return canWrite() && canEditWith(f, myRoles()); }
function canDo(action) { return canWrite() && canDoWith(action, myRoles()); }
const roleHint = (action) => `${tr("Доступно ролям:")} ${["admin", ...ACTIONS[action].roles].map(r => tr(ROLES[r].l)).join(", ")}.`;

function toast(msg, bad) {
  const el = document.createElement("div"); el.className = "toast" + (bad ? " bad" : ""); el.textContent = msg;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), bad ? 7000 : 3500);
}

/* ================= derived ================= */
function statusOf(t) {
  const out = [];
  if (Object.keys(conflictsOf(t)).length) out.push(["bad", tr("Конфликт")]);
  if (t.meta && t.meta.missing) out.push(["plain", tr("Нет в SmartLIS")]);
  const pf = pendingFields(t, F());
  if (pf.length) out.push(t.meta && t.meta.lastExport ? ["info", tr("Отправлено, ждёт подтверждения")] : ["acc", tr("К отправке")]);
  if (t.meta && t.meta.addedAt && t.meta.lastImport === t.meta.addedAt) out.push(["good", tr("Новый")]);
  return out;
}
function stripeOf(t) {
  if (Object.keys(conflictsOf(t)).length) return "bad";
  if (pendingFields(t, F()).length) return t.meta && t.meta.lastExport ? "info" : "acc";
  if (t.meta && t.meta.missing) return "warn";
  return "";
}
function counts() {
  let pending = 0, bad = 0;
  for (const t of S.tests.values()) { if (pendingFields(t, F()).length) pending++; }
  for (const c of CHECKS.filter(c => c.sev === "bad")) for (const t of S.tests.values()) if (c.fn(t, F())) bad++;
  const pub = [...S.tests.values()].filter(t => norm(t.val && t.val.publish) === "TRUE" && !(t.meta && t.meta.missing)).length;
  return { pending, bad, pub };
}

function colField(k) { return k === "code" ? CODE_FIELD : FM()[k]; }
function filtered() {
  const q = S.f.q.trim().toLowerCase();
  const check = CHECKS.find(c => c.id === S.f.check);
  const colFilters = Object.entries(S.cf).filter(([k, v]) => String(v ?? "").trim() && colField(k)).map(([k, v]) => [colField(k), v]);
  const list = [];
  for (const t of S.tests.values()) {
    if (q && !(t.code.toLowerCase().includes(q) || String(cv(t, "name") || "").toLowerCase().includes(q))) continue;
    if (S.f.status) {
      const st = S.f.status;
      if (st === "pending" && !pendingFields(t, F()).length) continue;
      if (st === "conflict" && !Object.keys(conflictsOf(t)).length) continue;
      if (st === "missing" && !(t.meta && t.meta.missing)) continue;
      if (st === "new" && !(t.meta && t.meta.addedAt && t.meta.lastImport === t.meta.addedAt)) continue;
      if (st === "ok" && (pendingFields(t, F()).length || Object.keys(conflictsOf(t)).length || (t.meta && t.meta.missing))) continue;
    }
    if (check && !check.fn(t, F())) continue;
    if (colFilters.some(([f, v]) => !matchCol(t, f, v, S.dicts))) continue;
    list.push(t);
  }
  const sf = S.sort.k && colField(S.sort.k);
  const byCol = sf ? compareBy(sf, S.sort.dir, S.dicts) : (a, b) => a.code.localeCompare(b.code);
  const secName = (t) => dictName(S.dicts, "sectionid", t.sl && t.sl.sectionid) || "~";
  list.sort((a, b) => (S.group ? secName(a).localeCompare(secName(b), "lv") : 0) || byCol(a, b));
  return list;
}

const CHUNK_IDS = Array.from({ length: CHUNKS }, (_, i) => "c" + String(i).padStart(2, "0"));

function rebuildFromChunks() {
  const m = new Map();
  for (const id of CHUNK_IDS) {
    const d = subs.chunks[id]; if (!d || !d.tests) continue;
    for (const code of Object.keys(d.tests)) { const t = d.tests[code]; if (t) m.set(code, { code, sl: t.sl || {}, val: t.val || {}, base: t.base || {}, meta: t.meta || {} }); }
  }
  S.tests = m;
  const h = {};
  for (const id of CHUNK_IDS) { const d = subs.hist[id]; if (d && d.h) Object.assign(h, d.h); }
  S.hist = h;
}

let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 60); }

async function loadSeed() {
  if (seedCache) return seedCache;
  let r = await fetch("seed.json");
  if (!r.ok) r = await fetch("seed.sample.json");   // repository ships only synthetic sample data
  seedCache = await r.json(); return seedCache;
}
function useSeed(seed, mode) {
  S.dicts = seed.dicts;
  S.tests = new Map(seed.tests.map(t => [t.code, JSON.parse(JSON.stringify({ meta: {}, ...t }))]));
  S.snapshotInfo = { date: seed.snapshotDate, source: seed.source };
  S.mode = mode;
}

async function boot() {
  const timer = setTimeout(async () => { if (S.mode === "loading") { useSeed(await loadSeed(), "local"); renderAll(); } }, 10000);
  try { db = await claude.use("db"); } catch (e) { db = null; }
  try { user = await claude.use("user"); } catch (e) { user = null; }
  try { downloads = await claude.use("downloads"); } catch (e) { downloads = null; }
  if (user) {
    try { S.me = await user.id(); } catch (e) {}
    try { S.perms.owner = !!user.isOwner(); S.perms.admin = !!user.canEdit() || S.perms.owner; const w = user.can("data.write"); S.perms.write = w !== false; } catch (e) {}
  } else { S.perms.admin = true; }
  pickRole();
  if (!db) { clearTimeout(timer); if (S.mode === "loading") { useSeed(await loadSeed(), "local"); renderAll(); } return; }

  let configSeen = false;
  db.doc("config/main").onSnapshot(snap => {
    if (snap.metadata.fromCache && !snap.exists) return;
    clearTimeout(timer);
    configSeen = true;
    if (!snap.exists) {
      if (S.mode !== "snapshot") loadSeed().then(seed => { useSeed(seed, "snapshot"); renderAll(); });
      return;
    }
    const c = snap.data();
    if (Array.isArray(c.fields) && c.fields.length) S.fields = mergeFields(c.fields, DEFAULT_FIELDS);
    S.settings = { ...DEFAULT_SETTINGS, ...(c.settings || {}) };
    S.dicts = c.dicts || {};
    if (S.mode !== "live") { S.mode = "live"; rebuildFromChunks(); }
    scheduleRender();
  }, err => { clearTimeout(timer); toast(tr("Хранилище недоступно: ") + err.code + tr(". Работаю со снимком, правки не сохранятся."), true); loadSeed().then(seed => { useSeed(seed, "local"); renderAll(); }); });

  db.collection("chunks").onSnapshot(snap => {
    for (const d of snap.docs) subs.chunks[d.id] = d.data();
    if (S.mode === "live") { rebuildFromChunks(); scheduleRender(); }
  }, err => toast(tr("Не удалось получить данные тестов: ") + err.code, true));
  db.collection("hist").onSnapshot(snap => {
    for (const d of snap.docs) subs.hist[d.id] = d.data();
    if (S.mode === "live") { rebuildFromChunks(); scheduleRender(); }
  }, () => {});
  db.collection("webver").orderBy("n", "desc").limit(WEB_KEEP).onSnapshot(snap => {
    S.web.versions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (S.view === "site") scheduleRender();
  }, () => {});
  db.doc("webpub/current").onSnapshot(snap => {
    S.web.current = snap.exists ? snap.data() : null;
    if (S.view === "site") scheduleRender();
  }, () => {});
  db.collection("events").orderBy("t", "desc").limit(100).onSnapshot(snap => {
    S.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (S.view === "log") scheduleRender();
  }, () => {});
}

async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); return await fn(); }
    throw e;
  }
}

// patches: {code: {sl?, val?, base?, meta?, code?}}; histAdd: {code: [entries]}
// History keeps the start of long texts only: a storage document holds at most 256 KiB
const HIST_TEXT = 300;
const clipText = (v) => (typeof v === "string" && v.length > HIST_TEXT ? v.slice(0, HIST_TEXT) + "…" : v);
const clipHist = (h) => ({ ...h, o: clipText(h.o), n: clipText(h.n) });
const tooBig = (e) => e && /limit|256|too large|size/i.test(String(e.message || ""));
async function commit(patches, histAdd, event) {
  const codes = Object.keys(patches);
  if (S.mode === "local") {
    for (const code of codes) S.tests.set(code, applyPatch(S.tests.get(code) || { code }, patches[code]));
    for (const code of Object.keys(histAdd || {})) S.hist[code] = (S.hist[code] || []).concat(histAdd[code]).slice(-HIST_CAP);
    if (event) S.events.unshift({ id: "local" + Date.now(), ...event });
    renderAll(); return true;
  }
  if (S.mode !== "live") { toast(tr("Сначала начните работу с данными (баннер сверху)."), true); return false; }
  const byChunk = {};
  for (const code of codes) { const c = chunkOf(code); (byChunk[c] = byChunk[c] || {})[code] = patches[code]; }
  const histByChunk = {};
  for (const code of Object.keys(histAdd || {})) {
    const c = chunkOf(code);
    (histByChunk[c] = histByChunk[c] || {})[code] = (S.hist[code] || []).concat(histAdd[code].map(clipHist)).slice(-HIST_CAP);
  }
  const chunkIds = [...new Set([...Object.keys(byChunk), ...Object.keys(histByChunk)])];
  try {
    let i = 0;
    for (const c of chunkIds) {
      setBusy(tr("Сохраняю"), i++, chunkIds.length);
      if (byChunk[c]) await withRetry(() => db.doc("chunks/" + c).update({ tests: byChunk[c] }));
      if (histByChunk[c]) await withRetry(() => db.doc("hist/" + c).update({ h: histByChunk[c] }));
    }
    if (event) await withRetry(() => db.collection("events").add(event));
    setBusy(null); return true;
  } catch (e) {
    setBusy(null);
    toast(tooBig(e) ? tr("Не удалось сохранить: часть данных превысила лимит хранилища (256 КБ на документ). Сообщите администратору.") : e && e.code === "invalid_argument" ? tr("Нет прав на изменение данных. Попросите владельца дать вам роль Contributor.") : tr("Не удалось сохранить: ") + (e && (e.message || e.code)), true);
    return false;
  }
}

async function initStore(tests, dicts, source) {
  if (!db) { toast(tr("Хранилище недоступно."), true); return; }
  const byChunk = {}; for (const id of CHUNK_IDS) byChunk[id] = {};
  for (const t of tests) byChunk[chunkOf(t.code)][t.code] = { sl: t.sl || {}, val: t.val || {}, base: t.base || {}, meta: { conflicts: {}, ...(t.meta || {}) } };
  const now = new Date().toISOString();
  try {
    let i = 0;
    for (const id of CHUNK_IDS) { setBusy(tr("Записываю каталог"), i++, CHUNK_IDS.length * 2); await withRetry(() => db.doc("chunks/" + id).set({ tests: byChunk[id] })); }
    for (const id of CHUNK_IDS) { setBusy(tr("Записываю каталог"), i++, CHUNK_IDS.length * 2); await withRetry(() => db.doc("hist/" + id).set({ h: {} })); }
    await withRetry(() => db.doc("config/main").set({ fields: S.fields, settings: S.settings, dicts, initializedAt: now, source }));
    await withRetry(() => db.collection("events").add({ t: now, u: S.me, r: S.role, kind: "init", title: tr("Каталог загружен"), summary: { tests: tests.length, source } }));
    setBusy(null); toast(`${tr("Каталог загружен:")} ${tests.length} ${tr("тестов.")}`);
  } catch (e) { setBusy(null); toast(tr("Не удалось записать каталог: ") + (e && (e.message || e.code)), true); }
}

const pubChip = (v) => { const n = norm(v); return n === "TRUE" ? `<span class="chip good">Jā</span>` : n === "AKC" ? `<span class="chip info">AKC</span>` : n === "FALSE" ? `<span class="chip plain">Nē</span>` : `<span class="chip warn">?</span>`; };
const boolChip = (v) => { const n = norm(v); return n === "TRUE" ? `<span class="chip good">Jā</span>` : n === "FALSE" ? `<span class="chip plain">Nē</span>` : `<span class="chip bad">${tr("пусто")}</span>`; };

function inputFor(f, value, id, extra) {
  const cls = extra || "";
  if (f.t === "bool") return `<select id="${id}" data-edit="${f.k}" class="${cls}"><option value=""${isEmpty(value) ? " selected" : ""}>—</option><option value="TRUE"${norm(value) === "TRUE" ? " selected" : ""}>Jā</option><option value="FALSE"${norm(value) === "FALSE" ? " selected" : ""}>Nē</option></select>`;
  if (f.t === "publish") return `<select id="${id}" data-edit="${f.k}" class="${cls}"><option value=""${isEmpty(value) ? " selected" : ""}>${tr("Не решено")}</option><option value="TRUE"${norm(value) === "TRUE" ? " selected" : ""}>${tr("Jā — общий каталог")}</option><option value="AKC"${norm(value) === "AKC" ? " selected" : ""}>${tr("AKC — акция")}</option><option value="FALSE"${norm(value) === "FALSE" ? " selected" : ""}>Nē</option></select>`;
  if (f.t === "dict") {
    const opts = (S.dicts[f.k] || []).slice().sort((a, b) => String(a[1]).localeCompare(String(b[1]), "lv"));
    return `<select id="${id}" data-edit="${f.k}" class="${cls}"><option value="">—</option>${opts.map(([v, n]) => `<option value="${esc(norm(v))}"${norm(v) === norm(value) ? " selected" : ""}>${esc(n)} (${esc(v)})</option>`).join("")}</select>`;
  }
  if (f.t === "long") return `<textarea id="${id}" data-edit="${f.k}" class="${cls}">${esc(isEmpty(value) ? "" : value)}</textarea>`;
  return `<input type="text" id="${id}" data-edit="${f.k}" class="${cls}" value="${esc(isEmpty(value) ? "" : value)}">`;
}
function bulkValueInput(k) { return inputFor(FM()[k], null, "bulk-value").replace('data-edit=', 'data-bulk='); }
function readInput(f, raw) {
  if (raw === "") return null;
  if (f.t === "bool") return raw === "TRUE";
  if (f.t === "dict") return Number(raw);
  if (f.t === "num") { const n = Number(String(raw).replace(",", ".")); return isNaN(n) ? raw : n; }
  return raw;
}

async function saveCard() {
  const t = S.tests.get(S.openCode); if (!t) return;
  const fm = FM(); const now = new Date().toISOString();
  const patch = { val: {} }; const hist = [];
  for (const k of Object.keys(S.edits)) {
    const v = S.edits[k];
    if (fm[k] && fm[k].req && v === null) { toast(`${tr("Поле «")}${fm[k].l}${tr("» нельзя оставить пустым.")}`, true); return; }
    const before = cv(t, k);
    if (same(v, before) && typeof v === typeof before) continue;
    if (!canEditField(fm[k])) { toast(`${tr("Нет прав менять «")}${fm[k].l}».`, true); return; }
    patch.val[k] = v;
    if (isSl(fm[k]) && !hasOwn(t.base, k)) { patch.base = patch.base || {}; patch.base[k] = t.sl[k] ?? null; }
    hist.push({ t: now, u: S.me, r: S.role, k: "edit", f: k, o: before ?? null, n: v });
  }
  if (!hist.length) { S.edits = {}; renderDrawer(); return; }
  const pc = priceChanges(t, patch.val, F(), S.settings).map(r => ({ ...r, code: t.code }));
  let event;
  if (pc.length) {
    if (!(await confirmPrices(pc, 1))) return;
    event = { t: now, u: S.me, r: S.role, kind: "price", title: `${tr("Цена:")} ${t.code}`, summary: { tests: 1, changes: pc.map(r => ({ f: r.f, o: r.o, n: r.n })) }, codes: [t.code] };
  }
  if (await commit({ [t.code]: patch }, { [t.code]: hist }, event)) { S.edits = {}; toast(tr("Сохранено.")); renderDrawer(); }
}

async function resolveConflict(k, how) {
  const t = S.tests.get(S.openCode); if (!t) return;
  const c = conflictsOf(t)[k]; if (!c) return;
  const now = new Date().toISOString();
  const patch = { base: { [k]: c.theirs }, meta: { conflicts: { [k]: null } } };
  if (how === "theirs") patch.val = { [k]: c.theirs };
  const h = { t: now, u: S.me, r: S.role, k: "resolve", f: k, o: t.val[k] ?? null, n: how === "theirs" ? c.theirs : t.val[k] };
  if (await commit({ [t.code]: patch }, { [t.code]: [h] })) toast(how === "theirs" ? tr("Принято значение SmartLIS.") : tr("Оставлено значение каталога; оно в очереди на отправку."));
}

async function bulkApply() {
  const k = $("#bulk-field").value; const f = FM()[k];
  const raw = $("#bulk-value").value; const v = readInput(f, raw);
  if (f.req && v === null) { toast(`«${f.l}${tr("» нельзя сделать пустым.")}`, true); return; }
  const codes = [...S.selected].filter(c => S.tests.has(c));
  const changed = codes.filter(c => !(same(cv(S.tests.get(c), k), v)));
  if (!canEditField(f)) { toast(`${tr("Нет прав менять «")}${f.l}».`, true); return; }
  if (f.price) {
    const max = S.settings.priceBulkMax ?? DEFAULT_SETTINGS.priceBulkMax;
    if (changed.length > max) { toast(`${tr("За одну операцию можно изменить цену не более чем у")} ${max} ${tr("тестов, а сейчас")} ${changed.length}${tr(". Разбейте правку на части (фильтр по секции) — так массовое изменение цен не пройдёт случайно.")}`, true); return; }
    if (!changed.length) { toast(tr("У всех выбранных тестов уже эта цена.")); return; }
    const rows = changed.map(c => { const r = priceChanges(S.tests.get(c), { [k]: v }, F(), S.settings)[0]; return { ...r, code: c }; });
    if (!(await confirmPrices(rows, changed.length))) return;
  }
  const ok = f.price ? true : await ask(`${tr("Изменить «")}${f.l}${tr("» на «")}${disp(k, v)}${tr("» у")} ${changed.length} ${tr("тестов?")}`, changed.length ? `${codes.length - changed.length} ${tr("из выбранных уже имеют это значение.")}` : tr("У всех выбранных тестов уже это значение."), tr("Изменить"));
  if (!ok || !changed.length) return;
  const now = new Date().toISOString(); const patches = {}, hist = {};
  for (const c of changed) {
    const t = S.tests.get(c);
    patches[c] = { val: { [k]: v } };
    if (isSl(f) && !hasOwn(t.base, k)) patches[c].base = { [k]: t.sl[k] ?? null };
    hist[c] = [{ t: now, u: S.me, r: S.role, k: "bulk", f: k, o: cv(t, k) ?? null, n: v }];
  }
  if (await commit(patches, hist, { t: now, u: S.me, r: S.role, kind: f.price ? "price" : "bulk", title: `${tr("Массовая правка:")} ${f.l} → ${disp(k, v)}`, summary: { field: k, value: v, tests: changed.length }, codes: changed.slice(0, 1000) })) {
    S.selected.clear(); toast(`${tr("Изменено тестов:")} ${changed.length}.`); renderAll();
  }
}

async function markSent(b) {
  const full = S._export; if (!full || !full.tests.length) return;
  const tests = exportBatch(b); if (!tests.length) return;
  const inBatch = new Set(tests.map(r => r.code));
  const p = { ...full, tests, items: full.items.filter(i => inBatch.has(i.code)), byField: {} };
  for (const i of p.items) p.byField[i.f] = (p.byField[i.f] || 0) + 1;
  const fm = FM();
  const priceItems = p.items.filter(i => fm[i.f] && fm[i.f].price);
  if (priceItems.length) {
    const rows = priceItems.map(i => { const o = i.smartlis, n = i.catalog; const on = Number(norm(o)), nn = Number(norm(n)); const rel = isEmpty(o) || isEmpty(n) || !on ? null : (nn - on) / on; return { code: i.code, f: i.f, o, n, rel, jump: rel === null || Math.abs(rel) >= (S.settings.priceJump ?? DEFAULT_SETTINGS.priceJump) }; });
    const nT = new Set(priceItems.map(i => i.code)).size;
    if (!(await confirmPrices(rows, nT))) return;
  }
  const ok = await ask(`${tr("Отметить")} ${p.tests.length} ${tr("тестов как отправленные?")}`, tr("Нажимайте после того, как JSON загружен в SmartLIS. Тесты останутся в списке со статусом «ждёт подтверждения», пока импорт из SmartLIS не покажет те же значения."), tr("Отметить"));
  if (!ok) return;
  const now = new Date().toISOString(); const id = now.replace(/[-:TZ.]/g, "").slice(0, 14);
  const patches = {}, hist = {};
  for (const r of p.tests) {
    patches[r.code] = { meta: { lastExport: { id, t: now } } };
    hist[r.code] = Object.keys(r).filter(k => k !== "code").map(k => ({ t: now, u: S.me, r: S.role, k: "export", f: k, o: S.tests.get(r.code).sl[k] ?? null, n: S.tests.get(r.code).val[k] ?? null }));
  }
  if (await commit(patches, hist, { t: now, u: S.me, r: S.role, kind: "export", title: `${tr("Отправка в SmartLIS, пакет")} ${id}`, summary: { tests: p.tests.length, fields: p.byField }, codes: p.tests.map(r => r.code).slice(0, 1000) })) toast(`${tr("Пакет")} ${id} ${tr("отмечен как отправленный.")}`);
}

function sheetRows(wb, name) {
  const key = wb.SheetNames.find(n => n.toLowerCase() === name.toLowerCase());
  return key ? XLSX.utils.sheet_to_json(wb.Sheets[key], { header: 1, raw: true, defval: null }) : null;
}
async function readImportFile(file) {
  const buf = await file.arrayBuffer();
  let rows;
  if (/\.xlsx?$/i.test(file.name)) {
    if (typeof XLSX === "undefined") { toast(tr("Не загрузилась библиотека для Excel. Сохраните выгрузку как CSV (UTF-8)."), true); return; }
    const wb = XLSX.read(buf, { type: "array" });
    rows = sheetRows(wb, "DB_Import") || XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
  } else {
    const d = decodeUtf8(new Uint8Array(buf));
    if (d.error) { S.importPlan = { errors: [d.error], warnings: [], newTests: [], changes: [], conflicts: [], converged: [], missing: [], byField: {}, cleared: {}, massCleared: [], unknownHeaders: [], absentFields: [], unknownIds: [], rowsCount: 0, patches: {} }; S.importFile = file.name; renderAll(); return; }
    rows = parseCsv(d.text);
  }
  S.importFile = file.name; S.importOverride = false;
  S.importPlan = planImport(rows, S.tests, F(), S.dicts, S.settings);
  renderAll();
}
async function applyImport() {
  const p = S.importPlan; if (!p) return;
  const now = new Date().toISOString();
  const hist = {};
  for (const c of p.changes) (hist[c.code] = hist[c.code] || []).push({ t: now, u: null, k: "import", f: c.f, o: c.old ?? null, n: c.new ?? null });
  for (const c of p.newTests) hist[c] = [{ t: now, u: null, k: "import", note: tr("Тест добавлен из SmartLIS") }];
  for (const c of p.conflicts) (hist[c.code] = hist[c.code] || []).push({ t: now, u: null, k: "import", note: `${tr("Конфликт по полю")} ${c.f}` });
  const patches = {};
  for (const code of Object.keys(p.patches)) { const pt = { ...p.patches[code] }; delete pt._new; patches[code] = pt; }
  const ok = await commit(patches, hist, { t: now, u: S.me, r: S.role, kind: "import", title: `${tr("Импорт из SmartLIS:")} ${S.importFile}`, summary: { rows: p.rowsCount, new: p.newTests.length, changes: p.changes.length, conflicts: p.conflicts.length, confirmed: p.converged.length, missing: p.missing.length } });
  if (ok) { toast(`${tr("Импорт применён: новых")} ${p.newTests.length}${tr(", изменений")} ${p.changes.length}${tr(", конфликтов")} ${p.conflicts.length}.`); S.importPlan = null; renderAll(); }
}

const WEB_KEEP = 10;   // versions kept for download and rollback
const curVersion = () => (S.web.current ? S.web.versions.find(v => v.id === S.web.current.id) || null : null);
async function publishWeb() {
  if (!canDo("web")) { toast(roleHint("web"), true); return; }
  const json = buildWebJson(S.tests, F(), S.dicts, S.settings);
  const text = JSON.stringify(json);
  const hashes = webHashes(json);
  const cur = curVersion();
  const d = diffWeb(cur ? cur.hashes : {}, hashes);
  if (cur && !d.total) { toast(tr("Изменений с прошлой публикации нет.")); return; }
  const incomplete = [...S.tests.values()].filter(t => norm(t.val.publish) === "TRUE" && missingWebContent(t, F()).length).length;
  const list = (label, a) => a.length ? `<p style="margin:4px 0"><b>${esc(label)} ${a.length}</b>: <span class="mono">${esc(a.slice(0, 30).join(", "))}${a.length > 30 ? " …" : ""}</span></p>` : "";
  const ok = await askEx({ title: tr("Опубликовать новую версию для сайта?"),
    html: `${list(tr("Новые на сайте:"), d.added)}${list(tr("Изменённые:"), d.changed)}${list(tr("Снимаются с сайта:"), d.removed)}
      ${incomplete ? `<div class="alert warn"><span>${tr("Опубликованных тестов без нужных текстов:")} <b>${incomplete}</b>. ${tr("Они попадут на сайт как есть.")}</span></div>` : ""}
      <p class="muted" style="margin:0">${tr("Сайт получит эту версию через API при следующем запросе. Предыдущую версию можно будет вернуть.")}</p>`,
    ok: tr("Опубликовать") });
  if (!ok) return;
  const n = Math.max(0, ...S.web.versions.map(v => v.n || 0)) + 1;
  const id = "v" + String(n).padStart(4, "0");
  const now = new Date().toISOString();
  const parts = splitText(text);
  const meta = { n, t: now, u: S.me, r: S.role, count: json.tests.length, akc: (json.promotions || []).length, parts: parts.length, bytes: text.length, hashes, diff: { added: d.added.length, changed: d.changed.length, removed: d.removed.length } };
  const event = { t: now, u: S.me, r: S.role, kind: "publish", title: `${tr("Опубликована версия")} ${n}`, summary: { tests: json.tests.length, ...meta.diff } };
  if (S.mode === "local") {
    S.web.local[id] = text; S.web.versions = [{ id, ...meta }, ...S.web.versions].slice(0, WEB_KEEP); S.web.current = { id, n, t: now, u: S.me };
    S.events.unshift({ id: "local" + Date.now(), ...event }); toast(`${tr("Опубликована версия")} ${n}.`); renderAll(); return;
  }
  if (S.mode !== "live") { toast(tr("Сначала начните работу с данными (баннер сверху)."), true); return; }
  try {
    for (let i = 0; i < parts.length; i++) { setBusy(tr("Публикую"), i, parts.length + 1); await withRetry(() => db.doc(`webverp/${id}_${i}`).set({ v: id, i, text: parts[i] })); }
    await withRetry(() => db.doc("webver/" + id).set(meta));
    await withRetry(() => db.doc("webpub/current").set({ id, n, t: now, u: S.me }));
    await withRetry(() => db.collection("events").add(event));
    setBusy(null); toast(`${tr("Опубликована версия")} ${n}.`);
    // keep the last WEB_KEEP versions; the current one is never removed
    const old = S.web.versions.filter(v => v.id !== id).slice(WEB_KEEP - 1);
    for (const v of old) { if (v.id === id) continue; for (let i = 0; i < (v.parts || 1); i++) await db.doc(`webverp/${v.id}_${i}`).delete().catch(() => {}); await db.doc("webver/" + v.id).delete().catch(() => {}); }
  } catch (e) { setBusy(null); toast(tr("Не удалось опубликовать: ") + (e && (e.message || e.code)), true); }
}
async function rollbackWeb(id) {

async function versionText(id) {
  if (S.web.local[id]) return S.web.local[id];

    S.page = 0; saveViewPrefs(); renderAll(); return;
  }
  const el = e.target.closest("[data-go],[data-act],[data-open]");
  if (!el) return;
  if (e.target.matches("input[type=checkbox][data-sel]")) return;
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.open && !el.dataset.act) { S.openCode = el.dataset.open; S.edits = {}; renderDrawer(); return; }
  const a = el.dataset.act;
  if (a === "go") return go(el.dataset.v);
  if (a === "close") { if (Object.keys(S.edits).length && !(await ask(tr("Закрыть без сохранения?"), tr("Несохранённые изменения пропадут."), tr("Закрыть")))) return; S.openCode = null; S.edits = {}; $("#drawer").innerHTML = ""; return; }
  if (a === "save") return saveCard();
  if (a === "discard") { S.edits = {}; renderDrawer(); return; }
  if (a === "resolve") return resolveConflict(el.dataset.k, el.dataset.how);
  if (a === "page") { S.page += Number(el.dataset.d); renderAll(); $("#main").scrollTop = 0; return; }
  if (a === "reset-filters") { S.f = { q: "", status: "", check: "" }; S.cf = {}; S.page = 0; renderAll(); return; }
  if (a === "publish") return publishWeb();
  if (a === "ver-back") return rollbackWeb(el.dataset.v);
  if (a === "ver-dl") return downloadVersion(el.dataset.v);
  if (a === "lang") { setLang(el.dataset.l); renderAll(); if (S.openCode) renderDrawer(); return; }
  if (a === "colpick") { S.colpick = !S.colpick; renderAll(); return; }
  if (a === "cols-default") { S.cols = DEFAULT_COLS.slice(); saveViewPrefs(); renderAll(); return; }
  if (a === "sort-clear") { S.sort = { k: null, dir: 1 }; saveViewPrefs(); renderAll(); return; }
  if (a === "clear-check") { S.f.check = ""; S.page = 0; renderAll(); return; }
  if (a === "go-check") { S.f = { q: "", status: "", check: el.dataset.c }; S.cf = {}; S.page = 0; go("catalog"); return; }
  if (a === "sel-page") { const codes = [...document.querySelectorAll("[data-sel]")].map(x => x.dataset.sel); const all = codes.every(c => S.selected.has(c)); codes.forEach(c => all ? S.selected.delete(c) : S.selected.add(c)); renderAll(); return; }
  if (a === "sel-all") { filtered().forEach(t => S.selected.add(t.code)); renderAll(); return; }
  if (a === "bulk-clear") { S.selected.clear(); renderAll(); return; }
  if (a === "bulk-apply") return bulkApply();
  if (a === "mark-sent") return markSent(el.dataset.b);
  if (a === "copy-json") return copyJson(el.dataset.what, el.dataset.b);
  if (a === "dl-json") return downloadJson(el.dataset.what, el.dataset.b);
  if (a === "import-cancel") { S.importPlan = null; renderAll(); return; }
  if (a === "import-apply") return applyImport();
  if (a === "excel-cancel") { S.excelPlan = null; renderAll(); return; }
  if (a === "excel-apply") return applyExcel();
  if (a === "init-seed") { const seed = await loadSeed(); const ok = await ask(tr("Начать работу с этим снимком?"), `${tr("Будут созданы общие данные:")} ${seed.tests.length} ${tr("тестов на")} ${seed.snapshotDate}${tr(". Потом их можно заменить актуальным Excel или обновить импортом из SmartLIS.")}`, tr("Начать")); if (!ok) return; await initStore(seed.tests, seed.dicts, seed.source); return; }
  if (a === "dict-tab") { S.dictTab = el.dataset.d; renderAll(); return; }
  if (a === "save-settings") {
    const n = Number($("#set-mass").value), pm = Number($("#set-pmax").value), pj = Number($("#set-pjump").value);
    if (!(n >= 10)) { toast(tr("Порог отправки должен быть не меньше 10."), true); return; }
    if (!(pm >= 1 && pm <= 500)) { toast(tr("Лимит массовой правки цен: от 1 до 500 тестов."), true); return; }
    if (!(pj >= 1)) { toast(tr("Порог выделения изменения цены — от 1%."), true); return; }
    return saveFieldsAndSettings({ settings: { ...S.settings, massLimit: n, priceBulkMax: pm, priceJump: pj / 100 } });
  }
});

document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.filter) { S.f[el.dataset.filter] = el.value; S.page = 0; renderAll(); return; }
  if (el.dataset.cf && el.tagName === "SELECT") { S.cf[el.dataset.cf] = el.value; S.page = 0; renderAll(); return; }
  if (el.dataset.col) {
    const k = el.dataset.col;
    S.cols = el.checked ? [...S.cols.filter(c => c !== k), k] : S.cols.filter(c => c !== k);
    if (!el.checked) { delete S.cf[el.dataset.col]; if (S.sort.k === el.dataset.col) S.sort = { k: null, dir: 1 }; }
    saveViewPrefs(); renderAll(); return;
  }
  if (el.id === "role-pick") { pickRole(el.value); S.edits = {}; S.selected.clear(); toast(`${tr("Роль:")} ${tr(ROLES[S.role].l)}.`); renderAll(); return; }
  if (el.id === "f-group") { S.group = el.checked; S.page = 0; renderAll(); return; }
  if (el.dataset.sel) { el.checked ? S.selected.add(el.dataset.sel) : S.selected.delete(el.dataset.sel); renderAll(); return; }
  if (el.id === "bulk-field") { $("#bulk-value-wrap").innerHTML = bulkValueInput(el.value); return; }
  if (el.dataset.edit) {
    if (el.tagName !== "SELECT") return;   // text fields are tracked by the input handler; re-rendering here would eat the next click
    const t = S.tests.get(S.openCode); const f = FM()[el.dataset.edit];
    const v = readInput(f, el.value);
    if (same(v, cv(t, f.k))) delete S.edits[f.k]; else S.edits[f.k] = v;
    renderDrawer(); return;
  }
  if (el.id === "file-import" && el.files[0]) return readImportFile(el.files[0]);
  if (el.id === "file-excel" && el.files[0]) return readExcel(el.files[0]);
  if (el.id === "import-override") { S.importOverride = el.checked; renderAll(); return; }
  if (el.id === "export-override") { S.exportOverride = el.checked; renderAll(); return; }
  if (el.id === "set-akc") return saveFieldsAndSettings({ settings: { ...S.settings, includeAkc: el.checked } });
  if (el.dataset.fset !== undefined) {
    const fields = S.fields.map(f => ({ ...f })); const f = fields[Number(el.dataset.fset)];
    if (el.dataset.p === "e") { f.e = el.value; if (f.o === "both") f.o = "smartlis"; } else f[el.dataset.p] = el.checked ? 1 : 0;
    return saveFieldsAndSettings({ fields });
  }
});

let qTimer = null;
let cfTimer = null;
document.addEventListener("input", (e) => {
  if (e.target.dataset.cf && e.target.tagName === "INPUT") {
    clearTimeout(cfTimer); const k = e.target.dataset.cf; const v = e.target.value; const pos = e.target.selectionStart;
    cfTimer = setTimeout(() => {
      S.cf[k] = v; S.page = 0; renderAll();
      const i = document.querySelector(`input[data-cf="${CSS.escape(k)}"]`); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
    }, 300);
    return;
  }
  if (e.target.id === "f-q") {
    clearTimeout(qTimer); const v = e.target.value;
    qTimer = setTimeout(() => { S.f.q = v; S.page = 0; renderAll(); const i = $("#f-q"); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250);
  }
  if (e.target.dataset.edit && (e.target.tagName === "TEXTAREA" || e.target.type === "text")) {
    const t = S.tests.get(S.openCode); const f = FM()[e.target.dataset.edit];
    const v = readInput(f, e.target.value);
    if (same(v, cv(t, f.k))) delete S.edits[f.k]; else S.edits[f.k] = v;
    e.target.classList.toggle("dirty", f.k in S.edits);
    const foot = document.querySelector(".drawer footer");
    if (foot) { const n = Object.keys(S.edits).length; foot.querySelector(".muted").textContent = n ? `${tr("Изменено полей:")} ${n}` : tr("Нет несохранённых изменений"); foot.querySelector('[data-act="save"]').disabled = !n || !canWrite(); foot.querySelector('[data-act="discard"]').disabled = !n; }
  }
});
document.addEventListener("toggle", (e) => {
  const d = e.target; if (!(d instanceof HTMLElement) || !d.matches("details.lang")) return;
  if (d.open) S.openLang = d.dataset.lang; else if (S.openLang === d.dataset.lang) S.openLang = null;
}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.openCode && !$("#modal").innerHTML) document.querySelector('.drawer [data-act="close"]').click(); });
["dragover", "dragleave", "drop"].forEach(ev => document.addEventListener(ev, (e) => {
  const z = e.target.closest && e.target.closest(".drop"); if (!z) return;
  e.preventDefault();
  if (ev === "dragover") z.classList.add("over"); else z.classList.remove("over");
  if (ev === "drop" && e.dataTransfer.files[0]) { const inp = z.querySelector("input[type=file]"); if (inp && inp.id === "file-excel") readExcel(e.dataTransfer.files[0]); else readImportFile(e.dataTransfer.files[0]); }
}));
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== S.view && ["catalog", "export", "import", "site", "checks", "log", "setup"].includes(v)) go(v); });

const startView = location.hash.slice(1);
if (["catalog", "export", "import", "site", "checks", "log", "setup"].includes(startView)) S.view = startView;
renderAll();
boot();
</script>
</body>
</html>
