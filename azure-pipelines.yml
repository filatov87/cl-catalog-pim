# Azure DevOps: run the prototype logic tests on every push to main and on pull requests.
# No dependencies to install: the tests use Node's built-in test runner.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest   # replace with the name of a self-hosted pool if Microsoft-hosted agents are not allowed

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Node.js 20

  - script: npm test
    displayName: Tests (prototype/logic.js)
